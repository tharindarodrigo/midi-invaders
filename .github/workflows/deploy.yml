name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate monorepo
        run: |
          pnpm -r lint
          pnpm -r test
          pnpm -r build

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=("DEPLOY_HOST")
          [[ -z "${DEPLOY_USER}" ]] && missing+=("DEPLOY_USER")
          [[ -z "${DEPLOY_PATH}" ]] && missing+=("DEPLOY_PATH")

          if [[ -z "${DEPLOY_SSH_KEY}" && -z "${DEPLOY_PASSWORD}" ]]; then
            missing+=("DEPLOY_SSH_KEY or DEPLOY_PASSWORD")
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required deploy secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Upload code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Run remote deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          envs: VITE_POSTHOG_KEY,VITE_POSTHOG_HOST
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            pnpm install --frozen-lockfile
            pnpm -r build
            pnpm -C apps/api exec prisma migrate deploy
            sudo systemctl restart midi-invaders-api
            sudo systemctl reload caddy
